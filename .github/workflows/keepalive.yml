name: keepalive

on:
  schedule:
    - cron: '0 5 */30 * *'   # 每 30 天一次
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update keepalive marker
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/.keepalive

      - name: Commit if needed
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .github/.keepalive
          git diff --cached --quiet || git commit -m "chore: keep repository active"
          git push
